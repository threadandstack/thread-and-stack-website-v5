name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # main already has ~267 lint errors; report them without failing
      # the job until they're cleaned up, then drop continue-on-error.
      - run: bun run lint
        continue-on-error: true
      - run: bun run build
